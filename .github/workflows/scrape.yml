name: Daily Scrape

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: daily-scrape

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scraper repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Clone openai-markdown-docs
        env:
          GH_TOKEN: ${{ secrets.DOCS_REPO_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "DOCS_REPO_TOKEN is not set"
            exit 1
          fi

          git clone https://github.com/razmser/openai-markdown-docs.git openai-markdown-docs
          branch="$(git -C openai-markdown-docs rev-parse --abbrev-ref HEAD)"
          git -C openai-markdown-docs remote set-url --push origin "https://x-access-token:${GH_TOKEN}@github.com/razmser/openai-markdown-docs.git"

          if ! git -C openai-markdown-docs push --dry-run origin "HEAD:refs/heads/${branch}" >/dev/null 2>&1; then
            echo "DOCS_REPO_TOKEN can read razmser/openai-markdown-docs but cannot push to it."
            echo "Create a fine-grained PAT for that repository with Contents: Read and write, then update the DOCS_REPO_TOKEN secret."
            exit 1
          fi

      # Discovery reads two manifests over plain HTTP, so it runs here as-is.
      # It must run: with a frozen page list, newly published endpoints and
      # whole new resources never reach the docs repo.
      - name: Run scraper
        run: python scrape_openai_docs.py

      - name: Export docs
        run: |
          rm -rf openai-markdown-docs/api-reference
          mkdir -p openai-markdown-docs/api-reference
          rsync -a --exclude='plans/' docs/ openai-markdown-docs/api-reference/

      - name: Commit and push if changed
        run: |
          cd openai-markdown-docs
          branch="$(git rev-parse --abbrev-ref HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: update $(date +%Y-%m-%d)"
            git pull --rebase origin "${branch}"
            git push origin "HEAD:${branch}"
          fi
